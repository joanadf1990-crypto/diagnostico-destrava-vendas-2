<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Diagnóstico Destrava Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#000;--panel:#0a0a0a;--line:#232323;--line2:#333;--gold:#F5B800;--gold2:#ffd54a;--white:#fff;--txt:#e9e9e9;--mut:#9a9a9a;--err:#ff6b5e;
--display:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--white);font-family:var(--body);font-size:16px;line-height:1.6;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px calc(120px + env(safe-area-inset-bottom))}
.logo{display:block;width:min(400px,84%);height:auto;margin:4px auto 0}
.logo.sm{width:132px;margin:0}
h1,h2,h3{font-family:var(--display);margin:0}
.hero{text-align:center;padding:8px 0 6px}
.hero h1{font-weight:900;font-size:clamp(1.55rem,6.4vw,2.4rem);line-height:1.1;letter-spacing:.01em;margin:20px 0 12px}
.hero h1 span{color:var(--gold)}
.hero .sub{color:var(--mut);font-size:1.02rem;margin:0 auto 26px;max-width:30em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.card p{margin:0 0 14px;color:var(--txt)}.card p:last-child{margin:0}
.rule{height:3px;width:48px;background:var(--gold);border-radius:3px;margin:0 auto 18px}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
display:grid;place-items:center;text-align:center;background:var(--gold);color:#000;border-radius:12px;padding:16px 22px;font-size:.95rem;min-height:56px;
transition:transform .12s,background .12s,opacity .12s}
.btn:hover{background:var(--gold2);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.big{width:100%;margin-top:22px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* topo + progresso */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px 12px}
.top-in{max-width:760px;margin:0 auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step-label{font-size:.78rem;color:var(--mut);text-align:right;line-height:1.4}.step-label b{color:var(--gold)}
.bar{height:5px;background:#1c1c1c;border-radius:5px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:5px;transition:width .35s}
/* blocos */
.block-head{margin:22px 0 18px}
.block-tag{display:inline-block;font-family:var(--display);font-weight:800;font-size:.7rem;letter-spacing:.16em;color:var(--gold);border:1px solid var(--gold);padding:5px 10px;border-radius:6px}
.block-head h2{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:800;margin:12px 0 0;line-height:1.2}
.legend{color:var(--mut);font-size:.85rem;margin:8px 0 0}
.q{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:18px 16px;margin-bottom:16px}
.q.bad{border-color:var(--err);border-left-color:var(--err)}
.q-n{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q-n b{font-family:var(--display);font-weight:900;color:#000;background:var(--gold);min-width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;padding:0 6px}
.q-n small{color:var(--mut);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.q-t{font-weight:600;font-size:1.04rem;line-height:1.5;margin:0 0 12px;color:var(--white)}
.q-t .nm{color:var(--gold)}
.req{color:var(--gold);font-weight:700}
label.fl{display:block;font-size:.85rem;font-weight:600;color:#d6d6d6;margin:0 0 6px}
textarea,input[type=text]{width:100%;background:#000;color:#fff;border:1px solid var(--line2);border-radius:11px;padding:14px;font:inherit;font-size:17px;line-height:1.55;transition:border-color .15s,box-shadow .15s}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,0,.18)}
textarea::placeholder,input::placeholder{color:#5f5f5f}
.err{color:var(--err);font-size:.85rem;margin-top:6px;display:none}.bad .err{display:block}
.field{margin-bottom:18px}.field:last-child{margin-bottom:0}.field.bad input{border-color:var(--err)}
.auto{background:#0f0f0f;border:1px dashed var(--line2);border-radius:11px;padding:13px 14px;font-weight:600;color:var(--gold)}.auto span{color:var(--mut);font-weight:400;font-size:.85rem}
.count{color:#5f5f5f;font-size:.75rem;text-align:right;margin-top:4px}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:12px}.nav .btn{flex:1}.nav .btn.ghost{flex:0 0 34%}
.saved{font-size:.72rem;color:var(--mut);text-align:center;margin-top:6px}
/* telas finais */
.done{text-align:center;padding-top:16px}
.done .check{width:80px;height:80px;margin:26px auto 6px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;font-size:2.4rem;color:var(--gold)}
.done h1{font-weight:900;font-size:clamp(1.6rem,7vw,2.4rem);margin:14px 0 18px;line-height:1.15}
.done .msg{max-width:30em;margin:0 auto 16px;color:var(--txt)}
.done .final{font-family:var(--display);font-weight:800;color:var(--gold);letter-spacing:.03em;border-top:1px solid var(--line);padding-top:20px;max-width:30em;margin:22px auto 0;font-size:.95rem}
.done .btn{max-width:440px;margin-left:auto;margin-right:auto}
.note{max-width:30em;margin:18px auto 0;border:1px solid #4d3a00;background:#110d00;border-radius:12px;padding:12px 14px;color:var(--gold2);font-size:.9rem}
.foot{text-align:center;color:#6e6e6e;font-size:.78rem;margin-top:24px}.foot a{color:var(--gold);font-weight:700}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:900px){.wrap{padding-top:32px}textarea{min-height:170px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>

    let first = null;
    const mark = n => { n.classList.add('bad'); if (!first) first = n; };
    if (step === 'ident') ['name', 'company', 'role', 'dept', 'tenure'].forEach(k => { if (!ok(S.ident[k])) mark(document.querySelector(`.field[data-k=${k}]`)); });
    else BLOCKS[+step.slice(1)].questions.forEach(q => { if (!ok(S.answers['q' + q.n])) mark(document.querySelector(`.q[data-q="${q.n}"]`)); });
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); const f = first.querySelector('input,textarea'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 350); }
    return !first;
  }
  function firstMissing() {
    if (['name', 'company', 'role', 'dept', 'tenure'].some(k => !ok(S.ident[k]))) return 'ident';
    const i = BLOCKS.findIndex(b => b.questions.some(q => !ok(S.answers['q' + q.n])));
    return i < 0 ? null : 'b' + i;
  }
  function next(to) {
    if (!validate(S.step)) return;
    if (to === 'done') { const m = firstMissing(); if (m) { go(m); setTimeout(() => validate(m), 60); return; } }
    go(to);
  }

  // ---------- mensagem do WhatsApp ----------
  const LINE = '━━━━━━━━━━━━━━━━━━';
  function buildMessage() {
    const dt = nowBR();
    const out = [[LINE, '*🔑 DIAGNÓSTICO DESTRAVA VENDAS*', LINE, '',
      `👤 *GESTOR:* ${S.ident.name.trim()}`, `🏢 *EMPRESA:* ${S.ident.company.trim()}`, `💼 *CARGO:* ${S.ident.role.trim()}`, `🗂️ *DEPARTAMENTO:* ${S.ident.dept.trim()}`, `⏱️ *TEMPO NA EMPRESA:* ${S.ident.tenure.trim()}`, `📅 *DATA E HORÁRIO:* ${dt}`].join('\n')];
    BLOCKS.forEach((b, i) => {
      const l = [LINE, `📌 *BLOCO ${i + 1} – ${b.title.toLocaleUpperCase('pt-BR')}*`, LINE, ''];
      b.questions.forEach(q => { l.push(`*${q.n}. ${q.text}*`, `➤ ${(S.answers['q' + q.n] || '—').trim()}`, ''); });
      out.push(l.join('\n').trim());
    });
    out.push(`${LINE}\n✅ *FIM DO DIAGNÓSTICO – DESTRAVA VENDAS*`);
    return out.join('\n\n');
  }
  const waUrl = () => 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(S.msg);

  function send(e) {
    const m = firstMissing();
    if (m) { e.preventDefault(); go(m); setTimeout(() => validate(m), 60); return; }
    S.msg = buildMessage();
    e.currentTarget.href = waUrl(); // o próprio botão é o link do WhatsApp
    setTimeout(() => go('manual'), 400);
  }

  function doneScreen() {
    const nm = firstName();
    return el('div', { class: 'wrap done fade' }, logo(), el('div', { class: 'check', 'aria-hidden': 'true' }, '✓'),
      el('h1', null, 'DIAGNÓSTICO CONCLUÍDO!'),
      el('p', { class: 'msg' }, 'Obrigado por dedicar seu tempo a este diagnóstico.'),
      el('p', { class: 'msg' }, 'Suas respostas serão utilizadas para identificar os principais gargalos da operação comercial e preparar uma análise estratégica da sua empresa.'),
      el('a', { class: 'btn big', id: 'send', href: '#', target: '_blank', rel: 'noopener', onclick: send }, 'ENVIAR DIAGNÓSTICO'),
      el('p', { class: 'foot', style: 'margin-top:10px' }, 'O envio é feito pelo seu WhatsApp, com todas as respostas organizadas.'),
      el('button', { class: 'btn ghost big', type: 'button', onclick: () => go(steps()[steps().length - 1]) }, 'Revisar respostas'),
      el('p', { class: 'final' }, 'DESTRAVA VENDAS – Mais estratégia, mais produtividade e melhores resultados.'));
  }

  function manualScreen() {
    if (!S.msg) S.msg = buildMessage();
    const cp = el('a', { href: '#', onclick: async e => { e.preventDefault(); const t = e.currentTarget;
      try { await navigator.clipboard.writeText(S.msg); t.textContent = 'mensagem copiada'; }
      catch (x) { const a = el('textarea', { style: 'position:fixed;opacity:0' }); a.value = S.msg; document.body.append(a); a.select(); try { document.execCommand('copy'); t.textContent = 'mensagem copiada'; } catch (y) { t.textContent = 'não foi possível copiar'; } a.remove(); } } }, 'copie a mensagem');
    return el('div', { class: 'wrap done fade' }, logo(), el('div', { class: 'check', 'aria-hidden': 'true' }, '➤'),
      el('h1', null, 'FALTA SÓ ENVIAR!'),
      el('p', { class: 'msg' }, 'O seu WhatsApp abre com o diagnóstico pronto. Toque em ', el('b', null, 'ENVIAR'), ' dentro do WhatsApp para concluir.'),
      el('a', { class: 'btn big', id: 'open', href: waUrl(), target: '_blank', rel: 'noopener' }, 'Abrir WhatsApp e enviar'),
      el('div', { class: 'note' }, 'O diagnóstico só chega à Destrava Vendas depois que você tocar em ENVIAR no WhatsApp.'),
      el('p', { class: 'foot' }, 'Se o WhatsApp não abrir, ', cp, ' e cole na conversa com a Destrava Vendas.'),
      el('button', { class: 'btn ghost big', type: 'button', onclick: () => go('done') }, 'Voltar'));
  }

  function render() {
    app.replaceChildren();
    const s = S.step;
    if (s === 'welcome') app.append(welcome());
    else if (s === 'done') app.append(doneScreen());
    else if (s === 'manual') app.append(manualScreen());
    else app.append(topbar(), s === 'ident' ? identStep() : blockStep(+s.slice(1)), navbar());
  }

  load();
  if (!steps().concat(['welcome', 'done', 'manual']).includes(S.step)) S.step = 'welcome';
  if (S.step === 'manual') S.step = 'done';
  render();
})();
</script></body></html>
